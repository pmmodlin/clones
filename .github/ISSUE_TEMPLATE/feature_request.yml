name: Idea / Идея
description: Suggest an improvement / Предложить улучшение
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do? / Что вы хотите сделать?
      description: The situation and what gets in the way today. / Ситуация и что сейчас мешает.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could clones help? / Как clones мог бы помочь?
